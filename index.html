<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · P.D. Edgar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ---------- palette + type (Prairie-inspired) ---------- */
  :root {
    --paper: #f5f0e4; --card: #fbf8f1; --ink: #2b2420; --muted: #75695c; --rule: #cdbf9f;
    --red: #a63a28; --ochre: #c4932f; --sage: #6e7c4e; --chip: #ebe3d1; --chip-ink: #4f4537;
    --indent: 1.5rem;
    --display: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
    --body: "Libre Caslon Text", "Big Caslon", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15.5px/1.6 var(--body); }
  main { max-width: 1180px; margin: 0 auto; padding: 3rem 2rem 5rem; }
  a { color: var(--red); text-decoration-color: var(--ochre); text-underline-offset: 2px; }

  /* ---------- header + art-glass band ---------- */
  header h1 { font: 600 2.6rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  header .pos { font: 400 .95rem var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: .6rem; }
  header .contact { margin-top: .5rem; font-size: .95rem; }
  header .contact span + span::before { content: " | "; color: var(--rule); }
  .band { height: 26px; margin: 1.75rem 0 0;
    background:
      linear-gradient(var(--ink), var(--ink)) top / 100% 2px no-repeat,
      linear-gradient(var(--ink), var(--ink)) bottom / 100% 1px no-repeat,
      repeating-linear-gradient(90deg, var(--red) 0 9px, transparent 9px 132px) 18px 50% / 100% 9px no-repeat,
      repeating-linear-gradient(90deg, var(--ochre) 0 6px, transparent 6px 132px) 44px 50% / 100% 6px no-repeat,
      repeating-linear-gradient(90deg, var(--sage) 0 6px, transparent 6px 132px) 92px 50% / 100% 6px no-repeat,
      linear-gradient(var(--rule), var(--rule)) center / 100% 1px no-repeat,
      repeating-linear-gradient(90deg, transparent 0 65px, var(--rule) 65px 66px); }

  /* ---------- tabs ---------- */
  nav { display: flex; gap: .25rem; margin: 1.25rem 0 1.25rem; border-bottom: 1px solid var(--rule); }
  nav button { font: 600 .82rem var(--display); letter-spacing: .16em; text-transform: uppercase; background: none;
               border: 0; padding: .7rem 1rem .55rem; cursor: pointer; color: var(--muted);
               border-bottom: 3px solid transparent; margin-bottom: -1px; }
  nav button:hover { color: var(--ink); }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

  /* ---------- sections + indentation ---------- */
  h2.sec { position: relative; font: 600 1.2rem var(--display); letter-spacing: .14em; text-transform: uppercase;
           margin: 2.75rem 0 .75rem; padding: 0 0 .45rem 1.4rem; border-bottom: 2px solid var(--ink); }
  h2.sec::before { content: ""; position: absolute; left: 0; top: .28em; width: .62em; height: .62em;
                   background: var(--red); box-shadow: inset 0 0 0 2px var(--red), inset 0 0 0 3px var(--paper); }
  h2.sec::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 1px; background: var(--rule); }
  h2.sec .meta { font: 400 .8rem var(--display); letter-spacing: .08em; color: var(--muted); }
  h3.sub { font: 600 .98rem var(--display); letter-spacing: .06em; margin: 1.5rem 0 .3rem var(--indent);
           padding-left: .65rem; border-left: 3px solid var(--ochre); }
  h4.h3 { font-size: .93rem; font-weight: normal; font-style: italic; color: var(--sage);
          margin: .8rem 0 .2rem calc(var(--indent) * 2); }
  .entry { display: grid; grid-template-columns: 1fr 13rem; gap: .15rem 1.5rem; padding: .55rem 0;
           border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
  .entry.d1 { margin-left: var(--indent); }
  .entry.d2 { margin-left: calc(var(--indent) * 2); }
  .entry.d3 { margin-left: calc(var(--indent) * 3); }
  .entry .title { font-weight: 700; }
  .entry .meta { color: var(--muted); font-size: .92rem; }
  .entry .date { text-align: right; font: .85rem/1.9 var(--display); letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
  .entry ul { margin: .2rem 0 0; padding-left: 1.1rem; font-size: .92rem; }
  .entry li::marker { color: var(--ochre); }
  .entry .links { font-size: .86rem; margin-top: .15rem; }
  .entry .links a + a { margin-left: .7rem; }
  .entry .note { font-size: .8rem; color: var(--red); }
  .tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
  .tag { font: 600 10.5px/1.8 var(--display); letter-spacing: .08em; text-transform: uppercase;
         background: var(--chip); color: var(--chip-ink); padding: 0 .5rem; }
  .tag.status { background: var(--red); color: #fff; }
  .tag.sec { background: none; border: 1px solid var(--rule); }
  body.hide-tags .tags { display: none; }
  .toolbar { display: flex; gap: 1rem; justify-content: flex-end; font: .8rem var(--display);
             letter-spacing: .06em; color: var(--muted); margin-bottom: .25rem; }
  .toolbar input { accent-color: var(--red); }

  /* ---------- rank view (art-glass panes) ---------- */
  .rank-help { font-size: .95rem; color: var(--muted); margin: 0 0 1rem; }
  .rank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .6rem; }
  .rank-box { position: relative; text-align: left; cursor: pointer; padding: .8rem .8rem .8rem 2.7rem; min-height: 3.6rem;
              font: 600 .78rem/1.35 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
              background: var(--card); border: 1px solid var(--rule); outline: 1px solid var(--rule); outline-offset: -5px; }
  .rank-box:hover { border-color: var(--ochre); outline-color: var(--ochre); }
  .rank-box .badge { position: absolute; left: .75rem; top: .75rem; width: 1.35rem; height: 1.35rem;
                     border: 1px solid var(--rule); font: 700 12px/1.3rem var(--display); text-align: center; letter-spacing: 0; }
  .rank-box.ranked { border-color: var(--red); outline-color: var(--ochre); background: #fbefe6; }
  .rank-box.ranked .badge { background: var(--red); border-color: var(--red); color: #fff; }
  .rank-actions { margin: .9rem 0 0; display: flex; gap: .5rem; }
  .rank-actions button { font: 600 .75rem var(--display); letter-spacing: .12em; text-transform: uppercase;
                         padding: .5rem .95rem; cursor: pointer; border: 1px solid var(--ink); background: none; color: var(--ink); }
  .rank-actions button:hover { background: var(--ink); color: var(--paper); }
  .divider { margin: 3rem 0 0; font: 600 .75rem var(--display); text-transform: uppercase; letter-spacing: .18em;
             color: var(--muted); border-top: 1px solid var(--rule); padding-top: .5rem; }

  .error { padding: 1rem; border: 1px solid var(--red); color: var(--red); }
  @media (max-width: 700px) {
    :root { --indent: .75rem; } main { padding: 2rem 1rem 4rem; }
    .entry { grid-template-columns: 1fr; } .entry .date { text-align: left; grid-row: 1; }
  }
  @media print { nav, .toolbar, .rank-panel, .tags, .band { display: none !important; } body { background: #fff; } }
</style>

</head>
<body class="hide-tags">
<main>
  <header id="header"></header>
  <nav role="tablist">
    <button role="tab" data-view="original">Original order</button>
    <button role="tab" data-view="date">By date</button>
    <button role="tab" data-view="rank">Rank sections</button>
  </nav>
  <div class="toolbar"><label><input type="checkbox" id="tagToggle"> Show type / category tags</label></div>
  <section id="view"></section>
</main>

<script>
/* ======================================================================
   Module 1 — data + small helpers
   ====================================================================== */
const STATE = { cv: null, rank: [] };
const RANK_KEY = "pd-cv-rank";

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== "") n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}
const pretty = s => s.replace(/-/g, " ");
const sectionById = id => STATE.cv.sections.find(s => s.id === id);

/* ======================================================================
   Module 2 — rendering one entry and one section
   ====================================================================== */
function renderEntry(e, { showSection = false, depth = 1 } = {}) {
  const meta = [e.role, e.venue, e.location].filter(Boolean).join(" · ");
  const st = e.date.status;
  const tags = el("div", { class: "tags" },
    el("span", { class: "tag" }, pretty(e.type)),
    el("span", { class: "tag" }, e.category),
    st && st !== "completed" ? el("span", { class: "tag status" }, pretty(st)) : null,
    showSection ? el("span", { class: "tag sec" }, sectionById(e.section).title) : null);
  return el("div", { class: `entry d${depth}`, "data-id": e.id },
    el("div", {},
      el("div", { class: "title" }, e.title),
      meta ? el("div", { class: "meta" }, meta) : null,
      e.details.length ? el("ul", {}, e.details.map(d => el("li", {}, d))) : null,
      e.links.length ? el("div", { class: "links" },
        e.links.map(l => el("a", { href: l.url, target: "_blank", rel: "noopener" }, l.label))) : null,
      e.note ? el("div", { class: "note" }, "Note: " + e.note) : null,
      tags),
    el("div", { class: "date" }, e.date.display || ""));
}

// One H1 section with its H2 subsections and H3 headings, in CV order.
function renderSection(sec) {
  const wrap = el("div", { class: "section", "data-section": sec.id }, el("h2", { class: "sec" }, sec.title));
  let sub, h3;
  for (const e of STATE.cv.entries.filter(x => x.section === sec.id)) {
    if (e.subsection !== sub) {
      sub = e.subsection; h3 = undefined;
      if (sub && sub !== sec.title) wrap.append(el("h3", { class: "sub" }, sub));
    }
    if (e.heading !== h3) { h3 = e.heading; if (h3) wrap.append(el("h4", { class: "h3" }, h3)); }
    wrap.append(renderEntry(e, { depth: 1 + (sub && sub !== sec.title ? 1 : 0) + (h3 ? 1 : 0) }));
  }
  return wrap;
}

/* ======================================================================
   Module 3 — the three views
   ====================================================================== */
const VIEWS = {
  // View 1: the CV exactly as ordered in the document
  original() {
    return STATE.cv.sections.map(renderSection);
  },

  // View 2: everything on one timeline, newest first
  date() {
    const groups = new Map([["Upcoming & In Submission", []], ["Current & Ongoing", []]]);
    const years = new Map(), undated = [];
    for (const e of STATE.cv.entries) {
      const d = e.date, key = d.end || d.start;
      if (["in-submission", "pending", "upcoming"].includes(d.status)) groups.get("Upcoming & In Submission").push(e);
      else if (d.ongoing || d.status === "in-progress") groups.get("Current & Ongoing").push(e);
      else if (key) { const y = key.slice(0, 4); (years.get(y) || years.set(y, []).get(y)).push(e); }
      else undated.push(e);
    }
    const byDateDesc = (a, b) => ((b.date.end || b.date.start || "") > (a.date.end || a.date.start || "") ? 1 : -1);
    [...years.keys()].sort().reverse().forEach(y => groups.set(y, years.get(y)));
    groups.set("Undated", undated);
    const out = [];
    for (const [label, list] of groups) {
      if (!list.length) continue;
      if (label !== "Undated") list.sort(byDateDesc);
      out.push(el("h2", { class: "sec" }, `${label} `, el("span", { class: "meta" }, `(${list.length})`)));
      list.forEach(e => out.push(renderEntry(e, { showSection: true })));
    }
    return out;
  },

  // View 3: click section boxes in order of importance
  rank() {
    const ranked = STATE.rank.map(sectionById).filter(Boolean);
    const unranked = STATE.cv.sections.filter(s => !STATE.rank.includes(s.id));
    const panel = el("div", { class: "rank-panel" },
      el("p", { class: "rank-help" },
        "Click the sections in order of importance, most important first. Click a numbered box again to remove it. " +
        "Sections you don't click follow in their original order."),
      el("div", { class: "rank-grid" }, STATE.cv.sections.map(s => {
        const i = STATE.rank.indexOf(s.id);
        return el("button", { class: "rank-box" + (i >= 0 ? " ranked" : ""), onclick: () => toggleRank(s.id) },
          el("span", { class: "badge" }, i >= 0 ? String(i + 1) : ""), s.title);
      })),
      el("div", { class: "rank-actions" },
        el("button", { onclick: () => setRank([]) }, "Reset"),
        el("button", { onclick: () => setRank(STATE.cv.sections.map(s => s.id)) }, "Use original order")));
    return [panel,
      ...ranked.map(renderSection),
      ranked.length && unranked.length ? el("div", { class: "divider" }, "Unranked sections") : null,
      ...unranked.map(renderSection)];
  },
};

/* ======================================================================
   Module 4 — ranking state (saved in this browser when possible)
   ====================================================================== */
function toggleRank(id) {
  const r = STATE.rank.includes(id) ? STATE.rank.filter(x => x !== id) : [...STATE.rank, id];
  setRank(r);
}
function setRank(r) {
  STATE.rank = r;
  try { localStorage.setItem(RANK_KEY, JSON.stringify(r)); } catch (_) {}
  show("rank", { keepScroll: true });
}
function loadRank() {
  try { STATE.rank = JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch (_) { STATE.rank = []; }
}

/* ======================================================================
   Module 5 — header, routing, boot
   ====================================================================== */
function renderHeader(m) {
  const h = document.getElementById("header");
  h.replaceChildren(
    el("h1", {}, m.name),
    el("div", { class: "pos" }, `Curriculum Vitae · ${m.position}`),
    el("div", { class: "contact" },
      el("span", {}, el("a", { href: "mailto:" + m.email }, m.email)),
      el("span", {}, el("a", { href: m.website }, m.website.replace(/^https?:\/\//, ""))),
      el("span", {}, m.handle)),
    el("div", { class: "band", "aria-hidden": "true" }));
}

function show(view, { keepScroll = false } = {}) {
  if (!VIEWS[view]) view = "original";
  const y = window.scrollY;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  document.getElementById("view").replaceChildren(...VIEWS[view]().filter(Boolean));
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
  if (keepScroll) window.scrollTo(0, y);
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
window.addEventListener("hashchange", () => STATE.cv && show(location.hash.slice(1)));
document.getElementById("tagToggle").addEventListener("change", e => document.body.classList.toggle("hide-tags", !e.target.checked));

fetch("cv.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(cv => { STATE.cv = cv; loadRank(); renderHeader(cv.meta); show(location.hash.slice(1)); })
  .catch(err => document.getElementById("view").replaceChildren(el("div", { class: "error" },
    `Couldn't load cv.json (${err.message}). If you opened this file directly, run a local server in this folder ` +
    `(e.g. "python3 -m http.server") and visit http://localhost:8000, or host both files together.`)));
</script>
</body>
</html>
